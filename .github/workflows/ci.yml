name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Build and run tests
      run: ./mvnw -B clean test

    - name: Generate Code Coverage Summary
      run: |
        echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Coverage | Covered / Total |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|----------|-----------------|" >> $GITHUB_STEP_SUMMARY
        awk -F, 'NR > 1 { inst_missed += $4; inst_cov += $5; branch_missed += $6; branch_cov += $7 } END { inst_total = inst_missed + inst_cov; branch_total = branch_missed + branch_cov; printf "| **Instructions** | %.2f%% | %d / %d |\n| **Branches** | %.2f%% | %d / %d |\n", (inst_cov/inst_total)*100, inst_cov, inst_total, (branch_total > 0 ? (branch_cov/branch_total)*100 : 100), branch_cov, branch_total }' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/

