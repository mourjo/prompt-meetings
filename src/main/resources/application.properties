spring.application.name=prompt.meetings

# Database Configuration (stored on disk in a folder named data)
spring.datasource.url=jdbc:h2:file:./data/meetingsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Show SQL queries for debugging
logging.level.org.springframework.jdbc=DEBUG
